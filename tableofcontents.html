<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table of Contents</title>

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #0b1f33, #123b5d, #0b263d);
            color: #1b1b1b;
        }

        h2 {
            text-align: center;
            color: white;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        th {
            background-color: #102f4a;
            color: white;
            padding: 15px;
            font-size: 18px;
            text-align: left;
            border-bottom: 3px solid #4db6d6;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #d6e1e8;
            font-size: 16px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td:first-child {
            width: 10%;
            text-align: center;
            color: #244b68;
            font-weight: bold;
        }

        td:last-child {
            width: 10%;
            text-align: center;
            color: #244b68;
            font-weight: bold;
        }

        .unit {
            background-color: #dcecf5;
            font-weight: bold;
        }

        .unit td {
            padding-top: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #9fc9dc;
        }

        .unit a {
            color: #0d3552;
            font-size: 18px;
        }

        .subunit {
            padding-left: 30px;
            font-weight: bold;
            color: #244b68;
            background-color: #f3f8fb;
        }

        .topic {
            padding-left: 50px;
            color: #444;
        }

        a {
            text-decoration: none;
        }

        a:hover {
            color: #168aad;
            text-decoration: underline;
        }

        tr:not(.unit):hover td {
            background-color: #eef8fc;
        }
    </style>

</head>

<body>

    <h2>TABLE OF CONTENTS</h2>

    <table>

        <tr>
            <th>Unit</th>
            <th>Contents</th>
            <th>Hours</th>
        </tr>

            <td>1</td>
            <td>
                <a href="chapter1.html">
                    Computer System
                </a>
            </td>
            <td>20</td>
        </tr>

        <tr>
            <td>1.1</td>
            <td class="subunit">
                Introduction of Computer
            </td>
            <td></td>
        </tr>

        <tr>
            <td>1.1.1</td>
            <td class="topic">
                Definition, characteristics and application of computer
            </td>
            <td></td>
        </tr>

    </table>

</body>

</html>
