<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table of Contents</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 40px;
            background: #f8f9fb;
            color: #333;
        }

        h2 {
            font-family: Georgia, serif;
            text-align: center;
            font-size: 30px;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e5e5;
        }

        th {
            background: #eeeeee;
            font-family: Georgia, serif;
            font-size: 16px;
            text-align: left;
            color: #222;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td:first-child {
            width: 10%;
            text-align: center;
            font-family: "Courier New", monospace;
            color: #555;
        }

        td:last-child {
            width: 10%;
            text-align: center;
            font-family: "Courier New", monospace;
        }

        .unit {
            background: #f4f4f4;
            font-weight: bold;
        }

        .unit td {
            padding-top: 14px;
            padding-bottom: 14px;
        }

        .unit a {
            font-family: Georgia, serif;
            font-size: 17px;
        }

        .subunit {
            padding-left: 30px;
            font-weight: 600;
        }

        .topic {
            padding-left: 50px;
            font-size: 14px;
            color: #555;
        }

        a {
            color: #222;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover {
            color: #666;
            text-decoration: underline;
        }

        tr:hover td {
            background: #fafafa;
        }
    </style>
</head>

<body>

    <h2>Table of Contents</h2>

    <table>

        <tr>
            <th>Unit</th>
            <th>Contents</th>
            <th>Hours</th>
        </tr>

            <td>1</td>
            <td>

                    Computer System
                </a>
            </td>
            <td>20</td>
        </tr>

        <tr>
            <td>1.1</td>
            <td class="subunit">Introduction of Computer</td>
            <td></td>
        </tr>

        <tr>
            <td>1.1.1</td>
            <td class="topic">
                Definition, characteristics and application of computer
            </td>
            <td></td>
        </tr>
